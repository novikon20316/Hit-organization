steps:
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'web'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/hit-organization/web:$COMMIT_SHA'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/hit-organization/web:$COMMIT_SHA'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'web'
      - '--image=gcr.io/hit-organization/web:$COMMIT_SHA'
      - '--region=us-central1'
images:
  - 'gcr.io/hit-organization/web:$COMMIT_SHA'
options:
  logging: CLOUD_LOGGING_ONLY
